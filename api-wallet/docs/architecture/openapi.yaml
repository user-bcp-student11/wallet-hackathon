openapi: 3.0.3
info:
  title: Wallet API - Onboarding y wallet
  version: 0.1.0
  description: |
    Contrato del onboarding guiado por el servidor, la activación de la wallet y la consulta de su estado.
    Los errores siguen RFC 9457 (Problem Details) y los mensajes están en español listos para mostrar.
    La identidad del usuario viaja en `X-User-Id` hasta que exista un mecanismo de sesión posterior al onboarding.
servers:
  - url: http://localhost:8080
security: []
tags:
  - name: Onboarding
    description: Flujo de registro guiado por el servidor.
  - name: Wallet
    description: Estado de la wallet y acceso al punto de entrada de pagos.

paths:
  /api/v1/onboardings:
    post:
      tags: [Onboarding]
      operationId: startOnboarding
      summary: Inicia el onboarding o devuelve el que está en curso
      description: 'Idempotente por `Idempotency-Key` y por usuario: recargar la aplicación devuelve el mismo onboarding.'
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Onboarding creado, con el primer paso como actual.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Onboarding' }
        '200':
          description: Onboarding en curso del usuario.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Onboarding' }
        '400': { $ref: '#/components/responses/InvalidRequest' }

  /api/v1/onboardings/{onboardingId}:
    get:
      tags: [Onboarding]
      operationId: getOnboarding
      summary: Consulta el estado y el progreso de un onboarding
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/OnboardingId'
      responses:
        '200':
          description: Onboarding con sus pasos y el paso actual.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Onboarding' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/onboardings/{onboardingId}/otp:
    post:
      tags: [Onboarding]
      operationId: requestOtp
      summary: Envía el código de verificación al celular
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/OnboardingId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestOtp' }
      responses:
        '204':
          description: Código enviado.
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/onboardings/{onboardingId}/steps/{stepCode}:
    post:
      tags: [Onboarding]
      operationId: submitStep
      summary: Envía los datos del paso actual
      description: |
        Solo se acepta el paso actual. Al completar el último paso el onboarding queda `COMPLETED` y la wallet
        `ACTIVE` en la misma operación. Repetir la confirmación final con la misma `Idempotency-Key`, o después de
        completada, devuelve la misma respuesta sin duplicar la activación.
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/OnboardingId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: stepCode
          in: path
          required: true
          schema: { type: string, example: identity }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitStep' }
      responses:
        '200':
          description: Paso completado. Devuelve el onboarding actualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Onboarding' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/wallet:
    get:
      tags: [Wallet]
      operationId: getWalletStatus
      summary: Consulta el estado de la wallet del usuario
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Estado de la wallet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WalletStatus' }
        '400': { $ref: '#/components/responses/InvalidRequest' }

  /api/v1/wallet/payments-access:
    get:
      tags: [Wallet]
      operationId: getPaymentsAccess
      summary: Consulta el acceso al punto de entrada de pagos de bajo monto
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Wallet activa; el punto de entrada de pagos está habilitado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentsAccess' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403':
          description: La wallet no está activa; el mensaje indica completar el onboarding.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/WalletNotActiveProblem' }

components:
  parameters:
    UserId:
      name: X-User-Id
      in: header
      required: true
      description: Identificador del usuario (UUID).
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: UUID por intento de envío, reutilizado en los reintentos. Una repetición devuelve la respuesta original.
      schema: { type: string, maxLength: 100 }
    OnboardingId:
      name: onboardingId
      in: path
      required: true
      schema: { type: string, format: uuid }

  schemas:
    Onboarding:
      type: object
      required: [id, status, stepNumber, totalSteps, steps, walletActive]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [IN_PROGRESS, COMPLETED, ABANDONED] }
        stepNumber: { type: integer, minimum: 1, description: 'Número del paso actual ("Paso X de N").' }
        totalSteps: { type: integer, minimum: 1 }
        currentStep: { type: string, description: 'Código del paso actual; ausente si está completado.', example: phone }
        instruction: { type: string, description: 'Instrucción del paso actual.' }
        nextStepLabel: { type: string, description: 'Etiqueta del paso siguiente; ausente en el último paso.' }
        steps:
          type: array
          items: { $ref: '#/components/schemas/Step' }
        walletActive: { type: boolean }

    Step:
      type: object
      required: [code, title, status]
      properties:
        code: { type: string, enum: [phone, identity, confirmation] }
        title: { type: string }
        status: { type: string, enum: [COMPLETED, CURRENT, PENDING] }

    SubmitStep:
      type: object
      required: [values]
      description: |
        Campos por paso. `phone`: phoneNumber, otpCode. `identity`: documentType (DNI|CE), documentNumber,
        firstName, lastName, birthDate (AAAA-MM-DD). `confirmation`: acceptedTerms ("true").
      properties:
        values:
          type: object
          additionalProperties: { type: string }

    RequestOtp:
      type: object
      required: [phoneNumber]
      properties:
        phoneNumber: { type: string, example: '912345678' }

    WalletStatus:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [NO_WALLET, ONBOARDING_IN_PROGRESS, ACTIVE] }
        onboardingId: { type: string, format: uuid }
        currentStep: { type: string }

    PaymentsAccess:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }

    Problem:
      type: object
      description: Problem Details (RFC 9457).
      required: [type, title, status, detail]
      properties:
        type: { type: string, example: /problems/validation-error }
        title: { type: string }
        status: { type: integer }
        detail: { type: string, description: 'Mensaje en español listo para mostrar.' }

    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              items: { $ref: '#/components/schemas/FieldError' }

    FieldError:
      type: object
      required: [field, message]
      properties:
        field: { type: string, example: documentNumber }
        message: { type: string, example: 'El DNI debe tener 8 dígitos.' }

    ConflictProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            currentStep: { type: string, description: 'Presente cuando se envió un paso fuera de orden.' }
            onboardingStatus: { type: string, enum: [COMPLETED, ABANDONED] }

    WalletNotActiveProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [walletState]
          properties:
            walletState: { type: string, enum: [NO_WALLET, ONBOARDING_IN_PROGRESS] }
            currentStep: { type: string }

  responses:
    InvalidRequest:
      description: Solicitud inválida o sin identificación de usuario.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Onboarding no encontrado para el usuario.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Paso fuera de orden, onboarding no disponible (abandonado o completado) o actualización concurrente.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ConflictProblem' }
    ValidationError:
      description: Datos faltantes o inválidos; un error por cada campo afectado.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ValidationProblem' }
