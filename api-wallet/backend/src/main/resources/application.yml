spring:
  application:
    name: wallet-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wallet}
    username: ${DB_USER:wallet}
    password: ${DB_PASSWORD:wallet}
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true

onboarding:
  abandon-hours: ${ONBOARDING_ABANDON_HOURS:24}
  abandon-check-interval: PT5M
  otp:
    fake-code: ${OTP_FAKE_CODE:123456}
  steps:
    - type: phone
      title: Verifica tu celular
      instruction: Ingresa tu número de celular y el código que te enviaremos.
    - type: identity
      title: Tus datos personales
      instruction: Ingresa tu documento, nombres y fecha de nacimiento.
    - type: confirmation
      title: Activa tu wallet
      instruction: Acepta los términos y condiciones para activar tu wallet.
